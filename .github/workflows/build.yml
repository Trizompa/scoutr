name: Build

on:
  push:
    branches: [main, initial-scaffold]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build src/ScoutR/ScoutR.csproj -c Release

      # A test copy you can download from the run page (Actions > the run > Artifacts).
      # It runs standalone but does not auto-update; releases do (see release.yml).
      - name: Publish test exe
        run: >
          dotnet publish src/ScoutR/ScoutR.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: ScoutR-win-x64
          path: publish/ScoutR.exe
